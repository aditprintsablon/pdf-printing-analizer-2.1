<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Printing Analyzer Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6; /* Blue-500 */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', /* blue-600 */
                        secondary: '#475569', /* slate-600 */
                        success: '#16a34a', /* green-600 */
                        warning: '#ea580c', /* orange-600 */
                        danger: '#dc2626', /* red-600 */
                    }
                }
            }
        }
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const DEFAULT_PRICES = {
            'Teks Hitam Putih': 500,
            'Teks Berwarna': 1000,
            'Teks + Gambar Hitam Putih': 1000,
            'Teks + Gambar Berwarna': 1500,
            'Gambar Full Hitam Putih': 1500,
            'Gambar Full Berwarna': 2000,
            'Manual Review': 0
        };

        const CATEGORY_COLORS = {
            'Teks Hitam Putih': 'bg-gray-100 text-gray-800 border-gray-300',
            'Teks Berwarna': 'bg-blue-100 text-blue-800 border-blue-300',
            'Teks + Gambar Hitam Putih': 'bg-slate-200 text-slate-800 border-slate-400',
            'Teks + Gambar Berwarna': 'bg-indigo-100 text-indigo-800 border-indigo-300',
            'Gambar Full Hitam Putih': 'bg-stone-200 text-stone-800 border-stone-400',
            'Gambar Full Berwarna': 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-300',
            'Manual Review': 'bg-red-100 text-red-800 border-red-300'
        };

        const AVAILABLE_FINISHING = [
            { id: 'laminasi', name: 'Laminasi', defaultPrice: 2500 },
            { id: 'jilid_biasa', name: 'Jilid Biasa', defaultPrice: 5000 },
            { id: 'jilid_spiral', name: 'Jilid Spiral', defaultPrice: 10000 },
            { id: 'potong', name: 'Potong', defaultPrice: 2000 },
            { id: 'cover', name: 'Cover Khusus', defaultPrice: 10000 }
        ];

        const DEFAULT_PAPER_MULTIPLIERS = {
            'Sesuai File': 1.0,
            'A4': 1.0,
            'F4 / Folio': 1.1,
            'A3': 2.0
        };

        // Helper: Convert Points to MM
        const ptToMm = (pt) => pt * 0.352778;
        
        // Helper: Detect Paper Size
        const detectPaperSize = (widthPt, heightPt) => {
            const w = Math.round(ptToMm(widthPt));
            const h = Math.round(ptToMm(heightPt));
            const min = Math.min(w, h);
            const max = Math.max(w, h);

            const isNear = (val, target, tolerance = 5) => Math.abs(val - target) <= tolerance;

            if (isNear(min, 210) && isNear(max, 297)) return 'A4';
            if (isNear(min, 148) && isNear(max, 210)) return 'A5';
            if (isNear(min, 297) && isNear(max, 420)) return 'A3';
            if (isNear(min, 216) && isNear(max, 279)) return 'Letter';
            if (isNear(min, 216) && isNear(max, 356)) return 'Legal';
            if (isNear(min, 215) && isNear(max, 330)) return 'F4/Folio';
            
            return `Custom (${min} x ${max} mm)`;
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-60 backdrop-blur-sm p-4" onClick={(e) => { if(e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden">
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50/80 sticky top-0 z-10">
                            <h2 className="text-xl font-bold text-gray-800">{title}</h2>
                            <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-100 text-gray-500 hover:text-red-600 transition-colors">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsPanel = ({ prices, onUpdatePrices, sensitivity, onUpdateSensitivity, finishingPrices, onUpdateFinishingPrices, paperMultipliers, onUpdatePaperMultipliers, storeName, onUpdateStoreName }) => {
            const [localPrices, setLocalPrices] = useState(prices);
            const [localFinishing, setLocalFinishing] = useState(finishingPrices);
            const [localMultipliers, setLocalMultipliers] = useState(paperMultipliers);
            const [localStoreName, setLocalStoreName] = useState(storeName);
            
            const handleChange = (cat, val) => {
                setLocalPrices(prev => ({...prev, [cat]: parseInt(val) || 0}));
            };

            const handleFinishingChange = (id, val) => {
                setLocalFinishing(prev => ({...prev, [id]: parseInt(val) || 0}));
            };

            const handleMultiplierChange = (size, val) => {
                setLocalMultipliers(prev => ({...prev, [size]: parseFloat(val) || 1}));
            };

            const handleSave = () => {
                onUpdatePrices(localPrices);
                onUpdateFinishingPrices(localFinishing);
                onUpdatePaperMultipliers(localMultipliers);
                onUpdateStoreName(localStoreName);
                alert("Pengaturan berhasil disimpan!");
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h4 className="font-semibold text-gray-700 mb-3 border-b pb-2">Informasi Toko</h4>
                        <div className="bg-gray-50 p-3 rounded border">
                            <label className="text-sm text-gray-600 block mb-1">Nama Toko / Usaha (untuk cetak nota)</label>
                            <input type="text" 
                                value={localStoreName} 
                                onChange={(e) => setLocalStoreName(e.target.value)}
                                className="w-full border p-1.5 rounded focus:outline-none focus:border-primary text-sm"
                                placeholder="Contoh: DIGITAL PRINTING"
                            />
                        </div>
                    </div>
                    <div>
                        <h4 className="font-semibold text-gray-700 mb-3 border-b pb-2">Pengaturan Harga / Halaman</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {Object.keys(DEFAULT_PRICES).filter(k => k !== 'Manual Review').map(cat => (
                                <div key={cat} className="flex justify-between items-center bg-gray-50 p-3 rounded border">
                                    <label className="text-sm text-gray-600 flex-1">{cat}</label>
                                    <div className="flex items-center w-32">
                                        <span className="bg-gray-200 px-2 py-1.5 rounded-l text-sm text-gray-600">Rp</span>
                                        <input type="number" 
                                            value={localPrices[cat]} 
                                            onChange={(e) => handleChange(cat, e.target.value)}
                                            className="w-full border p-1.5 rounded-r text-right focus:outline-none focus:border-primary text-sm"
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div>
                        <h4 className="font-semibold text-gray-700 mb-3 border-b pb-2">Pengaturan Harga Finishing</h4>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {AVAILABLE_FINISHING.map(item => (
                                <div key={item.id} className="flex justify-between items-center bg-gray-50 p-3 rounded border">
                                    <label className="text-sm text-gray-600 flex-1">{item.name}</label>
                                    <div className="flex items-center w-32">
                                        <span className="bg-gray-200 px-2 py-1.5 rounded-l text-sm text-gray-600">Rp</span>
                                        <input type="number" 
                                            value={localFinishing[item.id] !== undefined ? localFinishing[item.id] : item.defaultPrice} 
                                            onChange={(e) => handleFinishingChange(item.id, e.target.value)}
                                            className="w-full border p-1.5 rounded-r text-right focus:outline-none focus:border-primary text-sm"
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div>
                        <h4 className="font-semibold text-gray-700 mb-3 border-b pb-2">Pengali Harga Ukuran Kertas (Multiplier)</h4>
                        <p className="text-xs text-gray-500 mb-3">Tentukan pengali harga dasar untuk setiap ukuran kertas. (Contoh: F4 diisi 1.1 berarti harganya 1.1x lipat dari harga dasar, A3 = 2x lipat).</p>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            {['A4', 'F4 / Folio', 'A3'].map(size => (
                                <div key={size} className="flex justify-between items-center bg-gray-50 p-3 rounded border">
                                    <label className="text-sm text-gray-600 flex-1">{size}</label>
                                    <div className="flex items-center w-24">
                                        <span className="bg-gray-200 px-2 py-1.5 rounded-l text-sm text-gray-600">x</span>
                                        <input type="number" step="0.1" min="0.1"
                                            value={localMultipliers[size] || 1} 
                                            onChange={(e) => handleMultiplierChange(size, e.target.value)}
                                            className="w-full border p-1.5 rounded-r text-center focus:outline-none focus:border-primary text-sm"
                                        />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div>
                        <h4 className="font-semibold text-gray-700 mb-3 border-b pb-2">Sensitivitas Deteksi Warna</h4>
                        <p className="text-xs text-gray-500 mb-3">Sesuaikan seberapa ketat sistem mendeteksi warna pada halaman.</p>
                        <select 
                            value={sensitivity} 
                            onChange={(e) => onUpdateSensitivity(e.target.value)}
                            className="w-full border p-2 rounded focus:outline-none focus:border-primary"
                        >
                            <option value="rendah">Rendah (Mentoleransi sedikit warna/noise)</option>
                            <option value="normal">Normal (Rekomendasi)</option>
                            <option value="tinggi">Tinggi (Sangat sensitif terhadap warna)</option>
                        </select>
                    </div>
                    <div className="flex justify-end pt-4">
                        <button onClick={handleSave} className="bg-primary hover:bg-blue-700 text-white px-5 py-2 rounded shadow transition-colors">
                            <i className="fas fa-save mr-2"></i> Simpan Pengaturan
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [file, setFile] = useState(null);
            const [fileName, setFileName] = useState("");
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [progressText, setProgressText] = useState("");
            
            const [pageData, setPageData] = useState([]);
            const [prices, setPrices] = useState(DEFAULT_PRICES);
            const [sensitivity, setSensitivity] = useState("normal");
            const [storeName, setStoreName] = useState("DIGITAL PRINTING");
            
            const [finishingPrices, setFinishingPrices] = useState({
                'laminasi': 2500,
                'jilid_biasa': 5000,
                'jilid_spiral': 10000,
                'potong': 2000,
                'cover': 10000
            });
            const [paperMultipliers, setPaperMultipliers] = useState(DEFAULT_PAPER_MULTIPLIERS);
            const [targetPaper, setTargetPaper] = useState("Sesuai File");
            const [pageRange, setPageRange] = useState("");

            const [copies, setCopies] = useState(1);
            const [selectedFinishing, setSelectedFinishing] = useState({});
            
            const [filterCat, setFilterCat] = useState('Semua');
            const [searchQuery, setSearchQuery] = useState('');
            
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isInvoiceOpen, setIsInvoiceOpen] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            const [isPrintMode, setIsPrintMode] = useState(false);

            useEffect(() => {
                if (isPrintMode) {
                    const timer = setTimeout(() => {
                        window.print();
                        setIsPrintMode(false);
                    }, 400);
                    return () => clearTimeout(timer);
                }
            }, [isPrintMode]);

            const analyzeCanvasPixels = (canvas, sens) => {
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                
                let nonWhiteCount = 0;
                let colorCount = 0;
                
                let colorDiffThreshold = 25; 
                let colorRatioThreshold = 0.03; 
                
                if (sens === 'tinggi') { colorDiffThreshold = 15; colorRatioThreshold = 0.01; }
                else if (sens === 'rendah') { colorDiffThreshold = 40; colorRatioThreshold = 0.08; }

                for (let i = 0; i < imgData.length; i += 4) {
                    const r = imgData[i];
                    const g = imgData[i+1];
                    const b = imgData[i+2];
                    const a = imgData[i+3];

                    if (a < 50) continue;
                    if (r > 240 && g > 240 && b > 240) continue;
                    
                    nonWhiteCount++;

                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    if ((max - min) > colorDiffThreshold) {
                        colorCount++;
                    }
                }

                const totalPixels = canvas.width * canvas.height;
                const coverageRatio = nonWhiteCount / totalPixels;
                const colorRatio = nonWhiteCount === 0 ? 0 : colorCount / nonWhiteCount;
                
                return { 
                    isColor: colorRatio > colorRatioThreshold, 
                    coverageRatio, 
                    colorRatio,
                    confidence: calculateConfidence(colorRatio, colorRatioThreshold)
                };
            };

            const calculateConfidence = (ratio, threshold) => {
                const diff = Math.abs(ratio - threshold);
                if (diff > threshold * 2) return 98;
                if (diff > threshold) return 85;
                if (diff > threshold * 0.5) return 75;
                return 60;
            };

            const categorizePage = (isColor, coverageRatio, textLength, conf) => {
                if (conf < 60 && coverageRatio > 0) return 'Manual Review';

                const isTextHeavy = textLength > 100;
                const isImageHeavy = coverageRatio > 0.3 || (coverageRatio > 0.05 && textLength < 50);

                if (isTextHeavy && !isImageHeavy) {
                    return isColor ? 'Teks Berwarna' : 'Teks Hitam Putih';
                } else if (isTextHeavy && isImageHeavy) {
                    return isColor ? 'Teks + Gambar Berwarna' : 'Teks + Gambar Hitam Putih';
                } else if (!isTextHeavy && isImageHeavy) {
                    return isColor ? 'Gambar Full Berwarna' : 'Gambar Full Hitam Putih';
                } else {
                    return isColor ? 'Teks Berwarna' : 'Teks Hitam Putih';
                }
            };

            const handleFileUpload = async (event) => {
                const uploadedFile = event.target.files?.[0] || event.dataTransfer?.files?.[0];
                if (!uploadedFile) return;

                if (uploadedFile.type !== 'application/pdf') {
                    alert('Error: File tidak valid. Silakan upload file PDF.');
                    return;
                }

                setFile(uploadedFile);
                setFileName(uploadedFile.name);
                setIsAnalyzing(true);
                setProgress(0);
                setPageData([]);
                
                try {
                    const fileReader = new FileReader();
                    
                    fileReader.onload = async function(e) {
                        try {
                            const typedarray = new Uint8Array(e.target.result);
                            setProgressText("Membaca dokumen PDF...");
                            
                            const pdf = await pdfjsLib.getDocument(typedarray).promise;
                            const numPages = pdf.numPages;
                            const results = [];

                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            for (let i = 1; i <= numPages; i++) {
                                setProgressText(`Menganalisis halaman ${i} dari ${numPages}...`);
                                setProgress(Math.round((i / numPages) * 100));

                                const page = await pdf.getPage(i);
                                const viewport = page.getViewport({ scale: 1.0 });
                                
                                const paperSize = detectPaperSize(viewport.width, viewport.height);
                                
                                const textContent = await page.getTextContent();
                                const textString = textContent.items.map(item => item.str).join('');
                                const textLength = textString.trim().length;

                                const renderScale = 0.5; 
                                const renderViewport = page.getViewport({ scale: renderScale });
                                canvas.width = renderViewport.width;
                                canvas.height = renderViewport.height;
                                
                                await page.render({
                                    canvasContext: ctx,
                                    viewport: renderViewport
                                }).promise;

                                const thumbnailUrl = canvas.toDataURL('image/jpeg', 0.5);

                                const { isColor, coverageRatio, confidence } = analyzeCanvasPixels(canvas, sensitivity);
                                const category = categorizePage(isColor, coverageRatio, textLength, confidence);

                                results.push({
                                    pageNumber: i,
                                    size: paperSize,
                                    category: category,
                                    isColor: isColor,
                                    confidence: confidence,
                                    thumbnail: thumbnailUrl
                                });

                                await new Promise(r => setTimeout(r, 10)); 
                            }

                            setPageData(results);
                            setIsAnalyzing(false);
                            setProgressText("Analisis Selesai!");
                        } catch (error) {
                            console.error(error);
                            setIsAnalyzing(false);
                            if (error.name === 'PasswordException') {
                                alert('PDF terkunci/password protected dan tidak dapat dianalisis.');
                            } else {
                                alert('Terjadi kesalahan saat memproses PDF: ' + error.message);
                            }
                        }
                    };
                    
                    fileReader.readAsArrayBuffer(uploadedFile);
                } catch (err) {
                    setIsAnalyzing(false);
                    alert("Gagal membaca file.");
                }
            };

            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); };
            const handleDrop = (e) => { e.preventDefault(); e.stopPropagation(); handleFileUpload(e); };

            const handleCategoryChange = (pageNumber, newCategory) => {
                setPageData(prev => prev.map(p => {
                    if (p.pageNumber === pageNumber) {
                        return { ...p, category: newCategory, confidence: 100 };
                    }
                    return p;
                }));
            };

            const toggleFinishing = (id) => {
                setSelectedFinishing(prev => {
                    const next = {...prev};
                    if (next[id]) delete next[id];
                    else next[id] = 1;
                    return next;
                });
            };

            const updateFinishingQty = (id, qty) => {
                const val = parseInt(qty) || 1;
                setSelectedFinishing(prev => ({
                    ...prev,
                    [id]: Math.max(1, val)
                }));
            };

            const parsePageRange = (rangeStr, totalPages) => {
                if (!rangeStr || !rangeStr.trim()) return Array.from({length: totalPages}, (_, i) => i + 1);
                const pages = new Set();
                const parts = rangeStr.split(',');
                let hasAttempted = false;
                
                for (let part of parts) {
                    part = part.trim();
                    if(!part) continue;
                    hasAttempted = true;
                    if (part.includes('-')) {
                        const [startStr, endStr] = part.split('-');
                        const start = parseInt(startStr);
                        const end = parseInt(endStr);
                        if (!isNaN(start) && !isNaN(end) && start <= end) {
                            for (let i = start; i <= end; i++) {
                                if (i <= totalPages && i > 0) pages.add(i);
                            }
                        }
                    } else {
                        const page = parseInt(part);
                        if (!isNaN(page) && page <= totalPages && page > 0) pages.add(page);
                    }
                }
                
                if (hasAttempted && pages.size === 0) return [];
                return pages.size > 0 ? Array.from(pages) : Array.from({length: totalPages}, (_, i) => i + 1);
            };

            const activePages = useMemo(() => {
                if (pageData.length === 0) return [];
                const included = parsePageRange(pageRange, pageData.length);
                return pageData.filter(p => included.includes(p.pageNumber));
            }, [pageData, pageRange]);

            const filteredData = useMemo(() => {
                return pageData.filter(p => {
                    const matchCat = filterCat === 'Semua' || p.category === filterCat;
                    const searchLower = searchQuery.toLowerCase();
                    const matchSearch = p.pageNumber.toString().includes(searchLower) ||
                                        p.category.toLowerCase().includes(searchLower) ||
                                        p.size.toLowerCase().includes(searchLower);
                    return matchCat && matchSearch;
                });
            }, [pageData, filterCat, searchQuery]);

            const summary = useMemo(() => {
                const sums = {};
                Object.keys(DEFAULT_PRICES).forEach(k => sums[k] = 0);
                let totalPages = 0;

                activePages.forEach(p => {
                    sums[p.category] = (sums[p.category] || 0) + 1;
                    totalPages++;
                });

                const currentMultiplier = paperMultipliers[targetPaper] || 1.0;
                const adjustedPrices = {};
                Object.keys(prices).forEach(k => {
                    adjustedPrices[k] = Math.round(prices[k] * currentMultiplier);
                });

                let subtotal = 0;
                Object.keys(sums).forEach(cat => {
                    subtotal += (sums[cat] * adjustedPrices[cat]);
                });
                
                const printTotal = subtotal * copies;
                
                let finishingTotal = 0;
                Object.keys(selectedFinishing).forEach(id => {
                    const qty = selectedFinishing[id];
                    if (qty) {
                        finishingTotal += (finishingPrices[id] || 0) * qty;
                    }
                });

                return {
                    breakdown: sums,
                    totalPages,
                    adjustedPrices,
                    currentMultiplier,
                    subtotal,
                    printTotal,
                    finishingTotal,
                    grandTotal: printTotal + finishingTotal
                };
            }, [activePages, prices, copies, selectedFinishing, finishingPrices, targetPaper, paperMultipliers]);

            const formatRp = (num) => {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(num);
            };

            const triggerPrint = () => {
                setIsInvoiceOpen(false);
                setIsPrintMode(true);
            };

            const downloadCSV = () => {
                if(pageData.length === 0) return;
                
                const headers = ["Halaman", "Ukuran", "Kategori", "Harga (Per Copy)", "Confidence (%)"];
                const rows = pageData.map(p => [
                    p.pageNumber, 
                    p.size, 
                    p.category, 
                    summary.adjustedPrices[p.category] || 0,
                    p.confidence.toFixed(1)
                ]);
                
                let csvContent = "data:text/csv;charset=utf-8,";
                csvContent += headers.join(",") + "\n";
                rows.forEach(row => {
                    csvContent += row.join(",") + "\n";
                });
                
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Analisis_${fileName.replace('.pdf','')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const renderInvoiceContent = () => (
                <div className="bg-white p-8 max-w-md mx-auto font-mono text-sm text-gray-950 w-full">
                    <div className="text-center mb-6">
                        <h2 className="font-bold text-xl mb-1">{storeName}</h2>
                        <p className="text-xs">Struk Transaksi - PDF Analyzer</p>
                        <p className="text-xs border-b pb-2 mb-2">{new Date().toLocaleString('id-ID')}</p>
                    </div>
                    
                    <div className="mb-4 space-y-1">
                        <div className="flex"><span className="w-24">File</span>: <span className="flex-1 truncate">{fileName}</span></div>
                        <div className="flex"><span className="w-24">Kertas</span>: <span>{targetPaper}</span></div>
                        {pageRange && <div className="flex"><span className="w-24">Range Hal</span>: <span>{pageRange}</span></div>}
                        <div className="flex"><span className="w-24">Jml Halaman</span>: <span>{summary.totalPages} lbr</span></div>
                        <div className="flex"><span className="w-24">Copy</span>: <span>{copies}x</span></div>
                    </div>

                    <div className="border-t border-dashed border-gray-400 pt-2 mb-2">
                        <p className="font-bold mb-1">Rincian Cetak:</p>
                        {Object.keys(DEFAULT_PRICES).filter(k => summary.breakdown[k] > 0).map(cat => (
                            <div key={cat} className="flex justify-between items-start mb-1 text-xs">
                                <div className="w-2/3">
                                    <div>{cat}</div>
                                    <div className="text-gray-600">{summary.breakdown[cat]} lbr x {formatRp(summary.adjustedPrices[cat])}</div>
                                </div>
                                <div className="w-1/3 text-right">{formatRp(summary.breakdown[cat] * summary.adjustedPrices[cat])}</div>
                            </div>
                        ))}
                    </div>
                    
                    {Object.keys(selectedFinishing).length > 0 && (
                        <div className="border-t border-dashed border-gray-400 pt-2 mb-2">
                            <p className="font-bold mb-1">Finishing:</p>
                            {Object.keys(selectedFinishing).map(id => {
                                const qty = selectedFinishing[id];
                                if (!qty) return null;
                                const opt = AVAILABLE_FINISHING.find(f => f.id === id);
                                const unitPrice = finishingPrices[id] || 0;
                                return (
                                    <div key={id} className="flex justify-between text-xs mb-1">
                                        <span>{opt?.name || id} ({qty}x)</span>
                                        <span>{formatRp(unitPrice * qty)}</span>
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    <div className="border-t border-b border-dashed border-gray-400 py-2 mb-4 font-bold text-base">
                        <div className="flex justify-between">
                            <span>TOTAL</span>
                            <span>{formatRp(summary.grandTotal)}</span>
                        </div>
                    </div>
                    
                    <div className="text-center text-xs text-gray-600 mt-8">
                        Terima kasih atas kepercayaan Anda.
                    </div>
                </div>
            );

            if (isPrintMode) {
                return (
                    <div className="min-h-screen bg-white p-4 flex items-center justify-center">
                        {renderInvoiceContent()}
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center">
                                <div className="w-10 h-10 bg-primary text-white rounded-lg flex items-center justify-center text-xl shadow-inner">
                                    <i className="fas fa-print"></i>
                                </div>
                                <h1 className="ml-3 text-xl font-bold text-gray-800 tracking-tight">PDF PRINTING <span className="text-primary">ANALYZER</span></h1>
                            </div>
                            <button onClick={() => setIsSettingsOpen(true)} className="text-secondary hover:text-primary transition-colors flex items-center bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-md">
                                <i className="fas fa-cog mr-2"></i> Pengaturan
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        {!file || pageData.length === 0 ? (
                            <div 
                                className={`border-2 border-dashed rounded-xl p-12 text-center transition-all ${isAnalyzing ? 'border-primary bg-blue-50' : 'border-gray-300 bg-white hover:border-primary hover:bg-gray-50'}`}
                                onDragOver={handleDragOver}
                                onDrop={handleDrop}
                            >
                                {isAnalyzing ? (
                                    <div className="flex flex-col items-center">
                                        <div className="loader mb-4"></div>
                                        <h3 className="text-lg font-medium text-gray-900 mb-2">{progressText}</h3>
                                        <div className="w-full max-w-md bg-gray-200 rounded-full h-2.5 mb-2 overflow-hidden">
                                            <div className="bg-primary h-2.5 rounded-full transition-all duration-300" style={{width: `${progress}%`}}></div>
                                        </div>
                                        <p className="text-sm text-gray-500">{progress}%</p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="w-20 h-20 mx-auto bg-blue-100 text-primary rounded-full flex items-center justify-center text-3xl mb-4">
                                            <i className="fas fa-file-pdf"></i>
                                        </div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-2">Upload Dokumen PDF</h3>
                                        <p className="text-gray-500 mb-6 max-w-sm mx-auto">Drag & drop file PDF Anda di sini, atau klik tombol di bawah untuk memilih file dari komputer.</p>
                                        <label className="cursor-pointer bg-primary hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg shadow-md transition-colors inline-block">
                                            Pilih File PDF
                                            <input type="file" accept=".pdf" className="hidden" onChange={handleFileUpload} />
                                        </label>
                                    </>
                                )}
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-1 space-y-6">
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                        <div className="bg-slate-800 p-4 text-white">
                                            <h2 className="text-lg font-semibold flex items-center">
                                                <i className="fas fa-chart-pie mr-2"></i> Ringkasan Analisis
                                            </h2>
                                            <p className="text-sm text-slate-300 truncate mt-1" title={fileName}>{fileName}</p>
                                        </div>
                                        <div className="p-5">
                                            <div className="flex justify-between items-end mb-4 border-b pb-4">
                                                <div>
                                                    <p className="text-sm text-gray-500 font-medium">Total Halaman</p>
                                                    <p className="text-3xl font-bold text-gray-800">{summary.totalPages}</p>
                                                </div>
                                                <button onClick={() => { setFile(null); setPageData([]); setPageRange(''); }} className="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3.5 py-2 rounded-lg text-xs font-bold transition-colors flex items-center shadow-sm">
                                                    <i className="fas fa-redo-alt mr-1.5"></i> RESET & UPLOAD ULANG
                                                </button>
                                            </div>
                                            
                                            <div className="space-y-2 mb-6">
                                                {Object.keys(DEFAULT_PRICES).filter(k => summary.breakdown[k] > 0).map(cat => (
                                                    <div key={cat} className="flex justify-between items-center text-sm">
                                                        <span className="text-gray-600 flex items-center">
                                                            <span className={`w-2 h-2 rounded-full mr-2 ${cat.includes('Berwarna') ? 'bg-fuchsia-500' : 'bg-gray-500'}`}></span>
                                                            {cat}
                                                        </span>
                                                        <div className="text-right">
                                                            <span className="font-semibold text-gray-800">{summary.breakdown[cat]} <span className="text-xs font-normal text-gray-500">hal</span></span>
                                                            <div className="text-[10px] text-gray-400">@ {formatRp(summary.adjustedPrices[cat])}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                                {summary.totalPages === 0 && (
                                                    <div className="text-sm text-gray-500 italic text-center py-2">Tidak ada halaman yang dipilih</div>
                                                )}
                                            </div>

                                            <div className="bg-gray-50 p-4 rounded-lg space-y-3 border">
                                                <div className="flex items-center justify-between">
                                                    <label className="text-sm font-medium text-gray-700">Kertas (Target):</label>
                                                    <select value={targetPaper} onChange={(e) => setTargetPaper(e.target.value)} className="border rounded p-1 text-sm focus:border-primary focus:outline-none w-40 bg-white">
                                                        <option value="Sesuai File">Sesuai File (x1)</option>
                                                        <option value="A4">A4 (x{paperMultipliers['A4'] || 1})</option>
                                                        <option value="F4 / Folio">F4 / Folio (x{paperMultipliers['F4 / Folio'] || 1})</option>
                                                        <option value="A3">A3 (x{paperMultipliers['A3'] || 1})</option>
                                                    </select>
                                                </div>
                                                <div className="flex items-center justify-between">
                                                    <label className="text-sm font-medium text-gray-700">Range Halaman:</label>
                                                    <input type="text" placeholder="Cth: 1-5, 8" value={pageRange} onChange={(e) => setPageRange(e.target.value)} className="border rounded w-32 p-1 text-sm focus:border-primary focus:outline-none" title="Kosongkan untuk semua, atau isi format 1-5, 8" />
                                                </div>
                                                <div className="flex items-center justify-between">
                                                    <label className="text-sm font-medium text-gray-700">Jumlah Copy:</label>
                                                    <input type="number" min="1" value={copies} onChange={(e) => setCopies(parseInt(e.target.value)||1)} className="border rounded w-20 p-1 text-center font-bold focus:border-primary focus:outline-none" />
                                                </div>
                                                <hr />
                                                <div className="text-sm">
                                                    <p className="font-medium text-gray-700 mb-2">Biaya Tambahan (Finishing):</p>
                                                    {AVAILABLE_FINISHING.map(opt => {
                                                        const isSelected = !!selectedFinishing[opt.id];
                                                        const qty = selectedFinishing[opt.id] || 1;
                                                        return (
                                                            <div key={opt.id} className="mb-2 bg-white p-2 rounded border border-gray-100">
                                                                <div className="flex items-center justify-between">
                                                                    <label className="flex items-center cursor-pointer">
                                                                        <input type="checkbox" 
                                                                            checked={isSelected}
                                                                            onChange={() => toggleFinishing(opt.id)}
                                                                            className="mr-2 rounded text-primary focus:ring-primary h-4 w-4"
                                                                        />
                                                                        <span className="text-gray-700 text-sm">{opt.name}</span>
                                                                    </label>
                                                                    <span className="text-gray-500 text-xs">{formatRp(finishingPrices[opt.id] || 0)}/pcs</span>
                                                                </div>
                                                                {isSelected && (
                                                                    <div className="mt-2 flex items-center justify-between pl-6 text-xs text-gray-500">
                                                                        <span>Jumlah:</span>
                                                                        <input type="number" min="1" value={qty} 
                                                                            onChange={(e) => updateFinishingQty(opt.id, e.target.value)}
                                                                            className="border rounded w-16 px-1.5 py-0.5 text-center font-medium focus:border-primary focus:outline-none bg-white text-gray-800"
                                                                        />
                                                                    </div>
                                                                )}
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>

                                            <div className="mt-6 pt-4 border-t-2 border-dashed">
                                                <div className="flex justify-between items-center mb-1">
                                                    <span className="text-gray-500">Biaya Print:</span>
                                                    <span className="font-medium">{formatRp(summary.printTotal)}</span>
                                                </div>
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-gray-500">Finishing:</span>
                                                    <span className="font-medium">{formatRp(summary.finishingTotal)}</span>
                                                </div>
                                                <div className="flex justify-between items-center bg-blue-50 p-3 rounded-lg border border-blue-100">
                                                    <span className="font-bold text-gray-800">TOTAL:</span>
                                                    <span className="font-bold text-xl text-primary">{formatRp(summary.grandTotal)}</span>
                                                </div>
                                            </div>
                                            
                                            <div className="mt-4 grid grid-cols-2 gap-2">
                                                <button onClick={() => setIsInvoiceOpen(true)} className="bg-slate-800 hover:bg-slate-900 text-white py-2 rounded text-sm font-medium transition-colors shadow flex items-center justify-center">
                                                    <i className="fas fa-receipt mr-2"></i> Cetak Nota
                                                </button>
                                                <button onClick={downloadCSV} className="bg-green-600 hover:bg-green-700 text-white py-2 rounded text-sm font-medium transition-colors shadow flex items-center justify-center">
                                                    <i className="fas fa-file-excel mr-2"></i> Export CSV
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-2">
                                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full">
                                        <div className="p-4 border-b bg-gray-50 flex flex-col sm:flex-row justify-between items-center gap-4">
                                            <div className="relative w-full sm:w-64">
                                                <i className="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                                                <input 
                                                    type="text" 
                                                    placeholder="Cari halaman, kategori..." 
                                                    value={searchQuery}
                                                    onChange={e => setSearchQuery(e.target.value)}
                                                    className="w-full pl-10 pr-4 py-2 border rounded-lg focus:outline-none focus:border-primary text-sm"
                                                />
                                            </div>
                                            <div className="w-full sm:w-auto">
                                                <select 
                                                    value={filterCat} 
                                                    onChange={e => setFilterCat(e.target.value)}
                                                    className="w-full border py-2 px-3 rounded-lg focus:outline-none focus:border-primary text-sm bg-white"
                                                >
                                                    <option value="Semua">Semua Kategori</option>
                                                    {Object.keys(DEFAULT_PRICES).map(cat => (
                                                        <option key={cat} value={cat}>{cat}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>
                                        
                                        <div className="p-4 flex-1 overflow-y-auto max-h-[70vh] bg-gray-50/50">
                                            {filteredData.length === 0 ? (
                                                <div className="text-center text-gray-500 py-10">
                                                    <i className="fas fa-filter text-4xl mb-3 opacity-20"></i>
                                                    <p>Tidak ada halaman yang sesuai dengan filter/pencarian.</p>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                                    {filteredData.map((page, idx) => (
                                                        <div key={idx} className="bg-white border rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow group relative">
                                                            <div className="relative h-40 bg-gray-200 border-b cursor-pointer" onClick={() => setPreviewImage(page.thumbnail)}>
                                                                <img src={page.thumbnail} alt={`Page ${page.pageNumber}`} className="w-full h-full object-contain bg-white" loading="lazy" />
                                                                <div className="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-10 transition-all flex items-center justify-center">
                                                                    <i className="fas fa-search-plus text-white opacity-0 group-hover:opacity-100 text-2xl drop-shadow-md"></i>
                                                                </div>
                                                                <div className="absolute top-1 left-1 bg-black bg-opacity-70 text-white text-xs px-2 py-0.5 rounded">
                                                                    Hal {page.pageNumber}
                                                                </div>
                                                                <div className="absolute top-1 right-1 bg-white bg-opacity-90 text-gray-800 text-xs px-1.5 py-0.5 rounded font-mono shadow-sm">
                                                                    {page.size}
                                                                </div>
                                                            </div>
                                                            <div className="p-3">
                                                                <div className="mb-2">
                                                                    <select 
                                                                        value={page.category}
                                                                        onChange={(e) => handleCategoryChange(page.pageNumber, e.target.value)}
                                                                        className={`text-[10px] font-semibold px-2 py-1 rounded border inline-block w-full text-center cursor-pointer focus:outline-none ${CATEGORY_COLORS[page.category] || 'bg-gray-100'}`}
                                                                        title="Klik untuk mengubah kategori secara manual"
                                                                    >
                                                                        {Object.keys(DEFAULT_PRICES).map(cat => (
                                                                            <option key={cat} value={cat}>{cat}</option>
                                                                        ))}
                                                                    </select>
                                                                </div>
                                                                <div className="flex justify-between items-center">
                                                                    <span className="font-bold text-gray-800 text-sm">{formatRp(prices[page.category] || 0)}</span>
                                                                    {page.confidence < 70 && (
                                                                        <span className="text-warning" title={`Confidence: ${page.confidence.toFixed(0)}%. Cek Manual.`}>
                                                                            <i className="fas fa-exclamation-triangle"></i>
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <Modal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} title="Pengaturan Sistem">
                        <SettingsPanel 
                            prices={prices} 
                            onUpdatePrices={setPrices} 
                            sensitivity={sensitivity}
                            onUpdateSensitivity={setSensitivity}
                            finishingPrices={finishingPrices}
                            onUpdateFinishingPrices={setFinishingPrices}
                            paperMultipliers={paperMultipliers}
                            onUpdatePaperMultipliers={setPaperMultipliers}
                            storeName={storeName}
                            onUpdateStoreName={setStoreName}
                        />
                    </Modal>

                    {previewImage && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black bg-opacity-80 p-4" onClick={() => setPreviewImage(null)}>
                            <div className="relative max-w-4xl max-h-[90vh]">
                                <button className="absolute -top-10 right-0 text-white text-2xl hover:text-red-500"><i className="fas fa-times"></i></button>
                                <img src={previewImage} className="max-w-full max-h-[90vh] object-contain bg-white" alt="Preview" />
                            </div>
                        </div>
                    )}

                    <Modal isOpen={isInvoiceOpen} onClose={() => setIsInvoiceOpen(false)} title="Preview Nota">
                        <div className="flex flex-col items-center">
                            {renderInvoiceContent()}
                            <div className="mt-6 w-full">
                                <button onClick={triggerPrint} className="bg-primary hover:bg-blue-700 text-white px-4 py-2.5 rounded w-full font-medium transition-colors shadow flex items-center justify-center">
                                    <i className="fas fa-print mr-2"></i> Cetak Nota Sekarang
                                </button>
                            </div>
                        </div>
                    </Modal>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
